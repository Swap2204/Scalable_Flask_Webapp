<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docker Notes App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .note-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: white;
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .empty {
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Notes App</h1>

  <div class="note-form">
    <input type="text" id="noteInput" placeholder="Enter a note..." />
    <button onclick="addNote()">Add Note</button>
  </div>

  <ul id="notesList"></ul>

  <script>
    async function fetchNotes() {
      try {
        const response = await fetch('/api/notes');
        const notes = await response.json();

        const notesList = document.getElementById('notesList');
        notesList.innerHTML = '';

        if (!Array.isArray(notes) || notes.length === 0) {
          notesList.innerHTML = '<p class="empty">No notes yet.</p>';
          return;
        }

        notes.forEach(note => {
          const li = document.createElement('li');
          li.textContent = `#${note.id} - ${note.content}`;
          notesList.appendChild(li);
        });
      } catch (error) {
        console.error('Error fetching notes:', error);
      }
    }

    async function addNote() {
      const input = document.getElementById('noteInput');
      const content = input.value.trim();

      if (!content) {
        alert('Please enter a note.');
        return;
      }

      try {
        const response = await fetch('/api/notes', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ content })
        });

        const result = await response.json();

        if (!response.ok) {
          alert(result.error || 'Failed to add note.');
          return;
        }

        input.value = '';
        fetchNotes();
      } catch (error) {
        console.error('Error adding note:', error);
      }
    }

    fetchNotes();
  </script>
</body>
</html>
